services:
  postgres:
    image: postgres:16.3-alpine3.19
    restart: on-failure
    env_file: .env.development
    volumes:
      - data_postgres:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
volumes:
  data_postgres:
