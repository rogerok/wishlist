schema: spec-driven

context: |
  Language: Russian. Write all artifact prose in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Domain terms come from CONTEXT.md: use them verbatim in English and never use the synonyms it lists under "Avoid".
  Architecture decisions live in docs/adr/: reference an ADR instead of restating it.

rules:
  specs:
    - State exactly one behavior per requirement, with exactly one SHALL or MUST.
    - Do not reference scenarios from requirement text; a requirement must be understandable on its own.
    - Use SHALL/MUST only in requirement text, between `### Requirement:` and the first `#### Scenario:`; write scenario steps as observed facts in the present indicative.
    - Do not assert anything in a scenario that its requirement text does not state.
    - Describe exactly one event in WHEN; put prior events and preconditions in GIVEN.
    - Make GIVEN fix every piece of state that THEN depends on, including exact counts.
    - Copy identifiers (cookie names, error codes, response fields, paths) from the code or tests; never retype them.
    - When a change documents existing behavior, include only behavior confirmed by a passing test; list anything else as unverified in the proposal.
  tasks:
    - Name in each task the scenario it implements or verifies and the command whose passing result proves it.

operations:
  apply:
    guidance:
      - Check off a task only after running its command and seeing it pass; reading the code or the test is not enough.
      - If a check fails for a reason outside the task's own changes, stop and report the likely cause (environment, a spec that claims more than the test verifies, or a regression in existing code); do not edit tests or code outside the task's scope without the owner's confirmation.
